name: Bootstrap exact source snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact audited source files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part_* | base64 -d > /tmp/ypsilon-missing.tar.gz
          tar -xzf /tmp/ypsilon-missing.tar.gz
          rm -rf .bootstrap
          rm -f .tmp_probe_should_delete
          rm -f custom_components/ypsilon_local/brand/icon.png.base64-placeholder
          rm -f .github/workflows/bootstrap.yml
      - name: Validate restored source
        run: |
          python scripts/publication_check.py
          python scripts/audit.py
          python -m compileall -q custom_components/ypsilon_local scripts
      - name: Commit exact source snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Ypsilon 2.3.0 source snapshot"
          git push
