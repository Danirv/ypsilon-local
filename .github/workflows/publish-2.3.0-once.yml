name: Publish Ypsilon 2.3.0 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Danirv/ypsilon-local'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: c52078f726ecd20e02e4e93ab19c4ecf775e5e22
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release source
        run: |
          python scripts/publication_check.py
          python scripts/audit.py
          python -m compileall -q custom_components/ypsilon_local scripts

      - name: Verify release version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/ypsilon_local/manifest.json"))["version"])')"
          test "$VERSION" = "2.3.0" || { echo "Manifest version is $VERSION, expected 2.3.0"; exit 1; }

      - name: Build manual-install archive
        run: zip -r ypsilon_local-v2.3.0.zip custom_components/ypsilon_local -x "*/__pycache__/*" "*.pyc"

      - name: Create v2.3.0 release at validated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.3.0 >/dev/null 2>&1; then
            echo "Release v2.3.0 already exists; nothing to do."
            exit 0
          fi
          gh release create v2.3.0 ypsilon_local-v2.3.0.zip \
            --target c52078f726ecd20e02e4e93ab19c4ecf775e5e22 \
            --generate-notes \
            --title "Ypsilon v2.3.0"
