name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
