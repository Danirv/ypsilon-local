name: Publish GitHub release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Run this workflow from the main branch, not $GITHUB_REF"
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate release source
        run: |
          python scripts/publication_check.py
          python scripts/audit.py
          python -m compileall -q custom_components/ypsilon_local scripts
      - name: Resolve manifest version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/ypsilon_local/manifest.json"))["version"])')"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi
      - name: Create and push annotated release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Ypsilon $VERSION" "$GITHUB_SHA"
          git push origin "$TAG"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate release source
        run: |
          python scripts/publication_check.py
          python scripts/audit.py
          python -m compileall -q custom_components/ypsilon_local scripts
      - name: Verify tag matches manifest version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/ypsilon_local/manifest.json"))["version"])')"
          test "$TAG" = "$VERSION" || { echo "Tag v$TAG does not match manifest $VERSION"; exit 1; }
      - name: Build manual-install archive
        run: zip -r "ypsilon_local-${GITHUB_REF_NAME}.zip" custom_components/ypsilon_local -x "*/__pycache__/*" "*.pyc"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ypsilon_local-${GITHUB_REF_NAME}.zip" --verify-tag --generate-notes --title "Ypsilon ${GITHUB_REF_NAME}"
