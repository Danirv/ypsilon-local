name: Offline audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Offline audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Publication metadata check
        run: python scripts/publication_check.py
      - name: Integration audit and protocol regressions
        run: python scripts/audit.py
      - name: Compile Python
        run: python -m compileall -q custom_components/ypsilon_local scripts
